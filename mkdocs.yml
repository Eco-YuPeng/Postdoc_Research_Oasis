site_name: 'Cover Crop Dynamics & Data Science | Yu Peng'
site_description: 'AI-driven satellite harmonization for field-scale cover crop dynamics.'
site_author: Yu Peng
site_url: https://eco-yupeng.github.io/Postdoc_Research_Oasis/

# Repository
repo_name: YuPeng Postdoc OASIS
repo_url: https://github.com/Eco-YuPeng/Postdoc_Research_Oasis/
# The edit URI points MkDocs Material at the docs/ source so page edit links open in GitHub edit mode.
edit_uri: edit/main/docs/
# Copyright
copyright: 'Copyright &copy; 2026 University of Colorado Boulder'

# Include fragments generated by scripts/generate_image_slots.py. They are pulled into
# real pages with the snippets extension, so they must not be built as pages of their own.
exclude_docs: |
  _generated/

# Page tree
nav:
  - Home: index.md
  - Work Plan: work-plan.md
  - Postdoc Resources:
      - R and Python bilingualism: resources/bilingualism_md.md
      - STAC: resources/stac_mount_save.md
      - Sentinel 2 STAC example: resources/Pull_Sentinal2_l2_data.md
      - Markdown: resources/markdown_basics.md
      - CyVerse basics: resources/cyverse_basics.md
      - GitHub basics: resources/github_basics.md
      - CyVerse hacks: resources/cyverse_hacks.md
      - Docker basics: resources/docker_basics.md
      - Working groups and postdocs: resources/working_groups_and_postdocs.md

# Configuration
theme:
  highlightjs: true
  name: material
  font: false
  logo: 'assets/esiil_content/ESIIL_logo.png'
  favicon: 'assets/esiil_content/favicon.ico'
  features:
    - navigation.sections
    - navigation.instant
    - navigation.tracking
    - navigation.indexes
    - navigation.top
    - toc.integrate
    - toc.follow
    - content.action.edit
    - content.code.copy
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      primary: 'white'
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to system preference

# Options
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/cu-esiil/

extra_css:
  - stylesheets/tokens.css
  - stylesheets/extra.css

markdown_extensions:
  - attr_list
  - pymdownx.snippets:
      base_path:
        - docs

validation:
  omitted_files: ignore

plugins:
    - search
